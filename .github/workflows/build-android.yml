name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mindswipe-android-debug
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Mind Swipe debug APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36"

      - name: Install dependencies
        run: npm ci

      - name: Verify web app and sync Android
        run: |
          npm run check
          npx cap sync android

      - name: Verify Android trust boundary
        shell: bash
        run: |
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -q 'SCHEDULE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml
          ! grep -q 'ACCESS_.*LOCATION' android/app/src/main/AndroidManifest.xml

      - name: Validate and build debug APK and AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew lintDebug testDebugUnitTest assembleDebug bundleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MindSwipe-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MindSwipe-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
